name: Studio checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Validate studio site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check site.js
      - name: Regression tests
        run: node --test tests/site.test.mjs tests/explorer.test.mjs tests/empire.test.mjs
      - name: Install Chromium test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser interaction and responsive tests
        run: node --test tests/browser.test.mjs
      - name: Store browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
